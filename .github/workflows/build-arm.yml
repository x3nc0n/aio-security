name: Build ARM Template

on:
  push:
    branches: [main]
    paths:
      - '**.bicep'
      - '**.bicepparam'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Bicep CLI
        run: az bicep install

      - name: Compile Bicep to ARM JSON
        run: az bicep build --file main.bicep --outfile azuredeploy.json

      - name: Commit ARM template
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add azuredeploy.json
          if git diff --cached --quiet; then
            echo "No changes to azuredeploy.json"
          else
            git commit -m "chore: auto-compile Bicep → ARM template"
            git push
          fi
